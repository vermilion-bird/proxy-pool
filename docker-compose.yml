services:
  api:
    build: ./api
    container_name: pp-api
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - REDIS_DB=0
      - POOL_PREFIX=proxy-pool
      - WEB_DIR=/web/dist
      # 管理 API 认证（生产必配；逗号分隔多个 Key / IP·CIDR）
      - PP_API_KEYS=${PP_API_KEYS:-}
      - PP_IP_WHITELIST=${PP_IP_WHITELIST:-}
      # 调度模式（weighted 加权随机 / best 确定性选最优）
      - PP_SCHED_MODE=${PP_SCHED_MODE:-weighted}
      # 健康检查（可选，默认 30s 间隔 / 3次摘除 / 5次dead / 3次恢复）
      - PP_HC_INTERVAL=${PP_HC_INTERVAL:-30}
      - PP_HC_TIMEOUT=${PP_HC_TIMEOUT:-5}
      - PP_HC_FAIL_DEGRADED=${PP_HC_FAIL_DEGRADED:-3}
      - PP_HC_FAIL_DEAD=${PP_HC_FAIL_DEAD:-5}
      - PP_HC_RECOVER=${PP_HC_RECOVER:-3}
      - PP_HC_HTTP_PROBE=${PP_HC_HTTP_PROBE:-1}
      - PP_HC_PROBE_URL=${PP_HC_PROBE_URL:-http://example.com}
      # 质量封禁（低成功率自动下线）
      - PP_QUALITY_MIN_SUCCESS_RATE=${PP_QUALITY_MIN_SUCCESS_RATE:-0.5}
      # 审计历史（PostgreSQL，可选；置 PG_ENABLED=1 启用）
      - PG_ENABLED=${PG_ENABLED:-0}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=${PG_DB:-proxy_pool}
      - PG_USER=${PG_USER:-proxy_pool}
      - PG_PASSWORD=${PG_PASSWORD:-proxy_pool}
      - PP_QUALITY_MIN_REQUESTS=${PP_QUALITY_MIN_REQUESTS:-20}
    volumes:
      - ./web/dist:/web/dist:ro
    depends_on:
      - redis
      - postgres
    networks:
      - pp-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7
    container_name: pp-redis
    restart: unless-stopped
    command: ["redis-server", "--port", "6380"]
    networks:
      - pp-net

  postgres:
    image: postgres:16
    container_name: pp-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=proxy_pool
      - POSTGRES_USER=proxy_pool
      - POSTGRES_PASSWORD=${PG_PASSWORD:-proxy_pool}
    volumes:
      - pp-pgdata:/var/lib/postgresql/data
    networks:
      - pp-net

  grafana:
    image: grafana/grafana:latest
    container_name: pp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=***
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=true
    networks:
      - pp-net

  prometheus:
    image: prom/prometheus:latest
    container_name: pp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pp-net

volumes:
  pp-pgdata:

networks:
  pp-net:
    driver: bridge

